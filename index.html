<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090411" />
  <title>CEK SALDO E WALLET & BANK</title>
  <style>
    :root {
      --bg: #05030b;
      --bg2: #0b0718;
      --panel: rgba(12, 10, 22, .68);
      --panel-strong: rgba(17, 13, 30, .92);
      --line: rgba(166, 122, 255, .24);
      --line-strong: rgba(166, 122, 255, .42);
      --text: #f7f4ff;
      --muted: rgba(247, 244, 255, .68);
      --faint: rgba(247, 244, 255, .42);
      --neon: #a86dff;
      --neon2: #6f57ff;
      --cyan: #37d9ff;
      --ok: #6dffbf;
      --shadow: 0 18px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(168, 109, 255, .18);
      --radius: 28px;
      --radius-sm: 18px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(168,109,255,.14), transparent 22%),
        radial-gradient(circle at 85% 20%, rgba(55,217,255,.10), transparent 20%),
        linear-gradient(180deg, #040208 0%, #0a0617 48%, #040208 100%);
      overflow-x: hidden;
    }

    .screen {
      min-height: 100vh;
      display: none;
      position: relative;
      isolation: isolate;
    }
    .screen.active { display: grid; }

    /* LOGIN */
    #loginScreen {
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(3,2,8,.20), rgba(3,2,8,.74)),
        radial-gradient(circle at 50% 45%, rgba(168,109,255,.18), transparent 18%),
        url('gojo.jpg') center/cover no-repeat;
    }
    #loginScreen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(2,1,8,.55), rgba(2,1,8,.16) 42%, rgba(2,1,8,.55)),
        radial-gradient(circle at 50% 40%, rgba(168,109,255,.15), transparent 16%);
      backdrop-filter: blur(3px);
      z-index: -1;
    }
    .login-wrap {
      width: min(92vw, 460px);
      border-radius: 34px;
      padding: 26px;
      border: 1px solid rgba(215, 190, 255, .18);
      background: rgba(7, 5, 14, .46);
      box-shadow: 0 22px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03) inset, var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      letter-spacing: .22em;
      font-size: .72rem;
      color: rgba(255,255,255,.74);
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 16px rgba(109,255,191,.8);
    }
    .login-title {
      margin: 0;
      font-size: clamp(2.4rem, 9vw, 4rem);
      line-height: 1;
      letter-spacing: -.06em;
      font-weight: 900;
      text-shadow: 0 0 18px rgba(168,109,255,.55);
    }
    .login-sub {
      margin: 12px 0 20px;
      color: var(--muted);
      line-height: 1.55;
      font-size: .98rem;
    }
    .login-btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(168,109,255,.98), rgba(111,87,255,.98));
      box-shadow: 0 12px 30px rgba(111,87,255,.24), 0 0 0 1px rgba(255,255,255,.08) inset;
      transition: transform .18s ease, filter .18s ease;
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .login-btn:active { transform: translateY(1px) scale(.99); }
    .mini-note {
      margin-top: 14px;
      font-size: .8rem;
      color: rgba(255,255,255,.58);
      line-height: 1.5;
    }

    /* MAIN */
    #mainScreen {
      padding: 18px;
      background:
        radial-gradient(circle at 20% 10%, rgba(168,109,255,.15), transparent 20%),
        radial-gradient(circle at 84% 12%, rgba(55,217,255,.09), transparent 18%),
        linear-gradient(180deg, #05020a, #0a0616 55%, #05020a);
    }
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(rgba(168,109,255,.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,109,255,.15) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, black 28%, transparent 100%);
      z-index: -2;
    }
    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 2px 0;
    }
    .brand {
      font-size: clamp(1.55rem, 5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -.05em;
      text-shadow: 0 0 18px rgba(168,109,255,.5);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(168,109,255,.24);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: .8rem;
      white-space: nowrap;
    }
    .chip::before {
      content: "";
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px rgba(55,217,255,.8);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 16px;
    }
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
      border: 1px solid rgba(190,160,255,.16);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .hero-card, .result-card {
      min-height: 176px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      right: -35px;
      bottom: -35px;
      width: 210px;
      height: 210px;
      background: radial-gradient(circle, rgba(168,109,255,.24), transparent 68%);
      filter: blur(6px);
      pointer-events: none;
    }
    .hero-kicker, .result-label {
      color: var(--faint);
      font-size: .9rem;
      margin-bottom: 10px;
    }
    .hero-title {
      margin: 0;
      font-size: clamp(1.65rem, 4.4vw, 2.7rem);
      line-height: 1.03;
      letter-spacing: -.055em;
      font-weight: 900;
      max-width: 15ch;
    }
    .hero-desc {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 60ch;
      font-size: .98rem;
    }
    .result-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .result-value {
      margin: 0;
      font-size: clamp(1.9rem, 5.7vw, 3.2rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.06em;
      text-shadow: 0 0 18px rgba(168,109,255,.34);
    }
    .result-note {
      color: var(--faint);
      font-size: .82rem;
      line-height: 1.55;
      margin-top: 12px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .service {
      border: 1px solid rgba(190,160,255,.16);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      padding: 16px;
      cursor: pointer;
      color: var(--text);
      text-align: left;
      box-shadow: 0 10px 30px rgba(0,0,0,.22);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, filter .18s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      position: relative;
      overflow: hidden;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    .service:hover {
      transform: translateY(-2px);
      border-color: rgba(190,160,255,.36);
      box-shadow: 0 16px 38px rgba(0,0,0,.30), 0 0 0 1px rgba(168,109,255,.08) inset;
      filter: brightness(1.02);
    }
    .service:active { transform: translateY(1px) scale(.995); }
    .service::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(168,109,255,.08), transparent 35%);
      pointer-events: none;
    }
    .service-ico {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(168,109,255,.25), rgba(55,217,255,.1));
      box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset, 0 0 18px rgba(168,109,255,.18);
      position: relative;
    }
    .service-ico::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.07);
      pointer-events: none;
    }
    .service-ico img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      display: block;
      filter: drop-shadow(0 0 8px rgba(0,0,0,.18));
      background: rgba(255,255,255,.02);
    }
    .fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: -.05em;
      color: white;
      background: linear-gradient(135deg, rgba(168,109,255,.16), rgba(55,217,255,.08));
    }
    .service-title {
      display: block;
      font-size: 1rem;
      font-weight: 850;
      letter-spacing: -.02em;
      margin-bottom: 2px;
    }
    .service-sub {
      display: block;
      color: var(--faint);
      font-size: .82rem;
    }
    .footer-note {
      text-align: center;
      margin-top: 4px;
      font-size: .72rem;
      letter-spacing: .18em;
      color: rgba(247,244,255,.36);
      text-transform: uppercase;
      user-select: none;
    }
    .watermark {
      position: fixed;
      left: 16px;
      bottom: 12px;
      z-index: 1;
      pointer-events: none;
      font-size: .72rem;
      letter-spacing: .18em;
      color: rgba(247,244,255,.34);
      text-transform: uppercase;
    }

    /* MODAL */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2, 1, 7, .75);
      backdrop-filter: blur(12px);
    }
    .overlay.show { display: flex; }
    .modal {
      width: min(94vw, 480px);
      border-radius: 28px;
      border: 1px solid rgba(190,160,255,.20);
      background: linear-gradient(180deg, rgba(16, 11, 28, .94), rgba(7, 5, 14, .98));
      box-shadow: 0 22px 70px rgba(0,0,0,.5), var(--shadow);
      overflow: hidden;
      transform-origin: center;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .modal-head h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 850;
      letter-spacing: -.02em;
    }
    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
    }
    .modal-body { padding: 20px; }
    .field { display: grid; gap: 8px; margin-bottom: 14px; }
    .field label {
      font-size: .88rem;
      color: var(--muted);
    }
    .input {
      width: 100%;
      border: 1px solid rgba(168,109,255,.20);
      background: rgba(255,255,255,.04);
      color: white;
      border-radius: 16px;
      padding: 14px 16px;
      outline: none;
      font: inherit;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .input:focus {
      border-color: rgba(168,109,255,.54);
      box-shadow: 0 0 0 4px rgba(168,109,255,.12);
    }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, rgba(168,109,255,.98), rgba(111,87,255,.98));
      box-shadow: 0 10px 28px rgba(111,87,255,.22);
    }
    .btn.secondary {
      background: rgba(255,255,255,.06);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,.08);
    }
    .small-note {
      margin-top: 10px;
      color: rgba(247,244,255,.58);
      font-size: .8rem;
      line-height: 1.55;
    }
    .spinner-wrap {
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 24px 20px 28px;
    }
    .spinner {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.08);
      border-top-color: var(--neon);
      border-right-color: var(--cyan);
      animation: spin 1s linear infinite;
      box-shadow: 0 0 24px rgba(168,109,255,.24);
    }
    .pulse {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      overflow: hidden;
      position: relative;
    }
    .pulse::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 38%;
      background: linear-gradient(90deg, transparent, rgba(168,109,255,.95), rgba(55,217,255,.9), transparent);
      filter: blur(1px);
      animation: move 1.1s linear infinite;
    }
    .progress {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      overflow: hidden;
      border: 1px solid rgba(168,109,255,.18);
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(168,109,255,.92), rgba(55,217,255,.92));
      box-shadow: 0 0 24px rgba(168,109,255,.38);
      transition: width .18s ease;
    }
    .countdown {
      font-size: .86rem;
      color: var(--faint);
      text-align: center;
    }
    .shake { animation: shake .35s ease; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes move { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 70;
      max-width: min(92vw, 360px);
      background: rgba(12, 9, 20, .94);
      border: 1px solid rgba(168,109,255,.22);
      color: white;
      padding: 14px 16px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 920px) {
      .hero { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      #mainScreen { padding: 14px; }
      .topbar { padding-top: 2px; }
      .watermark { display: none; }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="screen active">
    <div class="login-wrap panel">
      <div class="eyebrow">ONLINE</div>
      <h1 class="login-title">LOGIN</h1>
      <p class="login-sub">
        SILAHKAN MASUKAN PASSWORD TERLEBIH DAHULU🔥
      </p>
      <button id="loginBtn" class="login-btn">MASUK</button>
      <div class="mini-note"> <b></b></div>
    </div>
  </div>

  <div id="mainScreen" class="screen">
    <div class="grid"></div>
    <div class="shell">
      <div class="topbar">
        <div class="brand">CEK SALDO</div>
        <div class="chip">TERHUBUNG KE SISTEM</div>
      </div>

      <section class="hero">
        <div class="panel hero-card">
          <div class="hero-kicker">Dashboard </div>
          <h2 class="hero-title">LAYANAN PENGECEKAN SALDO E WALLET MAUPUN BANK YANG SUDAH TE REGULASI NEGARA🇮🇩</h2>
          <p class="hero-desc">
           
           
          </p>
        </div>

        <div class="panel result-card">
          <div>
            <div class="result-label">Hasil terakhir</div>
            <p id="resultValue" class="result-value">—</p>
          </div>
          <div id="resultNote" class="result-note">Belum ada pengecekan.</div>
        </div>
      </section>

      <section id="cards" class="cards"></section>

      <div class="footer-note">verifikasi · real data</div>
    </div>
  </div>

  <div id="overlay" class="overlay" aria-hidden="true">
    <div id="modal" class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Loading...</h3>
        <button class="close" id="closeOverlay" aria-label="Tutup">✕</button>
      </div>
      <div id="modalContent" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div class="watermark">LAYANAN PENGECEKAN</div>

  <script>
    const services = [
      { key: 'DANA',  label: 'Cek Saldo DANA',  sub: 'Menu e-wallet', icon: 'assets/dana.jpg',  short: 'D', special: '08814104528' },
      { key: 'GOPAY', label: 'Cek Saldo GOPAY', sub: 'Menu e-wallet', icon: 'assets/gopay.jpg', short: 'G' },
      { key: 'OVO',   label: 'Cek Saldo OVO',   sub: 'Menu e-wallet', icon: 'assets/ovo.jpg',   short: 'O' },
      { key: 'BCA',   label: 'Cek Saldo BCA',   sub: 'Menu bank',     icon: 'assets/bca.jpg',   short: 'B' },
      { key: 'BRI',   label: 'Cek Saldo BRI',   sub: 'Menu bank',     icon: 'assets/bri.jpg',   short: 'R' },
      { key: 'BNI',   label: 'Cek Saldo BNI',   sub: 'Menu bank',     icon: 'assets/bni.jpg',   short: 'N' },
    ];

    const loginScreen = document.getElementById('loginScreen');
    const mainScreen = document.getElementById('mainScreen');
    const loginBtn = document.getElementById('loginBtn');
    const overlay = document.getElementById('overlay');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const closeOverlay = document.getElementById('closeOverlay');
    const resultValue = document.getElementById('resultValue');
    const resultNote = document.getElementById('resultNote');
    const toast = document.getElementById('toast');
    const cards = document.getElementById('cards');
    const fmt = new Intl.NumberFormat('id-ID');

    let currentService = null;
    let busy = false;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function openOverlay(title, bodyHTML) {
      modalTitle.textContent = title;
      modalContent.innerHTML = bodyHTML;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      currentService = null;
      busy = false;
    }

    function loadingMarkup(message = 'Memproses permintaan...') {
      return `
        <div class="spinner-wrap">
          <div class="spinner"></div>
          <div style="text-align:center; color: rgba(247,244,255,.84); font-weight:800;">${message}</div>
          <div class="pulse"></div>
          <div class="progress"><i id="progressBar"></i></div>
          <div id="countdownText" class="countdown">Menunggu...</div>
          <div style="text-align:center; color: rgba(247,244,255,.58); font-size:.82rem;">Harap tunggu sebentar</div>
        </div>`;
    }

    function randomBalance(min = 54193, max = 716292) {
      const n = Math.floor(Math.random() * (max - min + 1)) + min;
      return fmt.format(n);
    }

    function renderServices() {
      cards.innerHTML = services.map(s => `
        <button class="service" data-service="${s.key}">
          <div class="service-ico">
            <img src="${s.icon}" alt="Logo ${s.key}" loading="lazy"
                 onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback', textContent:'${s.short}'}))">
          </div>
          <div>
            <span class="service-title">${s.label}</span>
            <span class="service-sub">${s.sub}</span>
          </div>
        </button>
      `).join('');
    }

    function openPasswordForm() {
      openOverlay('MASUKAN PASSWORD', `
        <div class="field">
          <label>Password</label>
          <input id="passwordInput" class="input" type="password" placeholder="masukan password dengan benar" autocomplete="off" />
        </div>
        <div class="actions">
          <button id="submitPassword" class="btn">Lanjut</button>
          <button id="cancelPassword" class="btn secondary">Batal</button>
        </div>
        <div class="small-note"</div>
      `);

      const passwordInput = document.getElementById('passwordInput');
      const submitPassword = document.getElementById('submitPassword');
      const cancelPassword = document.getElementById('cancelPassword');
      passwordInput.focus();

      const submit = () => {
        if (busy) return;
        busy = true;
       const val = passwordInput.value.trim().toLowerCase();
        modal.classList.remove('shake');
        if (val !== 'dimas') {
          modal.classList.add('shake');
          showToast('Password salah. Coba lagi.');
          busy = false;
          return;
        }

        modalContent.innerHTML = loadingMarkup('Sedang memverifikasi...');
        let progress = 0;
        const bar = () => {
          const pb = document.getElementById('progressBar');
          const tx = document.getElementById('countdownText');
          progress = Math.min(progress + 2, 100);
          if (pb) pb.style.width = progress + '%';
          if (tx) tx.textContent = `Menyelesaikan proses masuk... ${Math.ceil((100 - progress) / 10)} detik`;
          if (progress < 100) requestAnimationFrame(() => setTimeout(bar, 70));
        };
        bar();

        const delay = 3000 + Math.floor(Math.random() * 1000);
        setTimeout(() => {
          loginScreen.classList.remove('active');
          mainScreen.classList.add('active');
          closeModal();
          showToast('Berhasil masuk ke data.');
        }, delay);
      };

      submitPassword.addEventListener('click', submit);
      cancelPassword.addEventListener('click', closeModal);
      passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submit();
      });
    }

    loginBtn.addEventListener('click', () => {
      openOverlay('Loading', loadingMarkup('Menyiapkan halaman login...'));
      let progress = 0;
      const step = () => {
        const pb = document.getElementById('progressBar');
        const tx = document.getElementById('countdownText');
        progress = Math.min(progress + 3, 100);
        if (pb) pb.style.width = progress + '%';
        if (tx) tx.textContent = `Membuka layar login... ${Math.ceil((100 - progress) / 10)} detik`;
        if (progress < 100) requestAnimationFrame(() => setTimeout(step, 75));
      };
      step();
      setTimeout(openPasswordForm, 3300);
    });

    function openCheckForm(service) {
      currentService = service;
      const label = `Cek saldo ${service.key}`;
      openOverlay(label, `
        <div class="field">
          <label>Masukkan nomor anda</label>
          <input id="numberInput" class="input" inputmode="numeric" placeholder="Masukkan nomor anda" autocomplete="off" />
        </div>
        <div class="actions">
          <button id="checkBalanceBtn" class="btn">Cek Saldo</button>
          <button id="cancelCheckBtn" class="btn secondary">Batal</button>
        </div>
        <div class="small-note">
          masukan nomor anda !!!
        </div>
      `);

      const numberInput = document.getElementById('numberInput');
      const checkBalanceBtn = document.getElementById('checkBalanceBtn');
      const cancelCheckBtn = document.getElementById('cancelCheckBtn');
      numberInput.focus();

      const doCheck = () => {
        if (busy) return;
        busy = true;
        const raw = numberInput.value.trim();
        if (!raw) {
          modal.classList.add('shake');
          showToast('Masukkan nomor terlebih dahulu.');
          busy = false;
          return;
        }

        openOverlay('Loading', loadingMarkup(`Mengecek saldo ${service.key}...`));

        let progress = 0;
        const timer = setInterval(() => {
          progress = Math.min(progress + 2, 100);
          const pb = document.getElementById('progressBar');
          const tx = document.getElementById('countdownText');
          if (pb) pb.style.width = progress + '%';
          if (tx) tx.textContent = `Memverifikasi data pengguna... ${Math.ceil((100 - progress) / 10)} detik`;
          if (progress >= 100) clearInterval(timer);
        }, 200);

        setTimeout(() => {
          const balance = (service.key === 'DANA' && raw === '08814104528')
            ? '1.930.235'
            : randomBalance();

          resultValue.textContent = `Rp ${balance}`;
          resultNote.textContent = `Hasil pengguna ${service.key} untuk nomor ${raw}. comnected ke layanan asli.`;

          modalContent.innerHTML = `
            <div style="padding: 2px 2px 4px;">
              <div style="color: rgba(247,244,255,.64); font-size:.88rem; margin-bottom:10px;">Hasil cek saldo</div>
              <div style="font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 900; letter-spacing: -.06em;">Rp ${balance}</div>
              <div class="small-note">proses selesai untuk <b>${service.key}</b>. conected ke sistem nyata.</div>
              <div class="actions" style="margin-top:18px;">
                <button id="againBtn" class="btn">Cek Lagi</button>
                <button id="closeResultBtn" class="btn secondary">Tutup</button>
              </div>
            </div>
          `;

          const againBtn = document.getElementById('againBtn');
          const closeResultBtn = document.getElementById('closeResultBtn');
          againBtn.addEventListener('click', () => {
            closeModal();
            setTimeout(() => openCheckForm(service), 120);
          });
          closeResultBtn.addEventListener('click', closeModal);
          busy = false;
        }, 10000);
      };

      checkBalanceBtn.addEventListener('click', doCheck);
      cancelCheckBtn.addEventListener('click', closeModal);
      numberInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doCheck();
      });
    }

    renderServices();

    cards.addEventListener('click', (e) => {
      const btn = e.target.closest('.service');
      if (!btn) return;
      const service = services.find(s => s.key === btn.dataset.service);
      if (service) openCheckForm(service);
    });

    closeOverlay.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
